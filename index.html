* { box-sizing: border-box; }
body {

function play() { audio.play().catch(() => {}); }
function render() {
  const dur = audio.duration || current.duration, t = audio.currentTime, pct = (t / dur) * 100;
  $("fill").style.width = pct + "%";
  $("knob").style.left = pct + "%";
  $("track").setAttribute("aria-valuenow", Math.round(pct));
  $("time").textContent = fmt(t) + " / " + fmt(dur);
  let idx = 0;
  current.chapters.forEach((c, i) => { if (t >= c.start - 0.25) idx = i; });
  document.querySelectorAll(".chapters button").forEach((b, i) => b.setAttribute("aria-current", i === idx));
}

$("play").onclick = () => (audio.paused ? play() : audio.pause());
$("back").onclick = () => { audio.currentTime -= 15; };
$("fwd").onclick = () => { audio.currentTime += 30; };
$("speed").onclick = () => {
  const next = speeds[(speeds.indexOf(audio.playbackRate) + 1) % speeds.length];
  audio.playbackRate = next; $("speed").textContent = next + "×"; store.set("speed", next);
};
audio.onplay = () => { $("icon").innerHTML = '<path d="M6 4.5h4v15H6zM14 4.5h4v15h-4z"/>'; $("play").setAttribute("aria-label", "Pause"); };
audio.onpause = () => { $("icon").innerHTML = '<path d="M7 4.5v15l13-7.5z"/>'; $("play").setAttribute("aria-label", "Play"); };
audio.ontimeupdate = () => { render(); store.set("pos:" + current.date, audio.currentTime); };
audio.onloadedmetadata = render;

const seekTo = (e) => { const r = $("track").getBoundingClientRect(); audio.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * (audio.duration || current.duration); render(); };
$("track").addEventListener("pointerdown", (e) => { seekTo(e); $("track").setPointerCapture(e.pointerId); });
$("track").addEventListener("pointermove", (e) => { if (e.buttons) seekTo(e); });
$("track").addEventListener("keydown", (e) => { if (e.key === "ArrowRight") audio.currentTime += 10; if (e.key === "ArrowLeft") audio.currentTime -= 10; });

const savedSpeed = parseFloat(store.get("speed"));
if (speeds.includes(savedSpeed)) { audio.playbackRate = savedSpeed; audio.defaultPlaybackRate = savedSpeed; $("speed").textContent = savedSpeed + "×"; }

$("count").textContent = EPISODES.length + (EPISODES.length === 1 ? " episode" : " episodes");
$("archive").replaceChildren(...EPISODES.map((ep) => el("li", {}, [
  el("button", { onclick: () => { load(ep); window.scrollTo({ top: 0 }); } }, [
    el("span", { className: "d", textContent: ep.date }), el("span", { className: "t", textContent: ep.title }), el("span", { className: "len", textContent: Math.round(ep.duration / 60) + " min" }),
  ]),
])));
document.querySelectorAll(".archive button").forEach((b, i) => { b.dataset.date = EPISODES[i].date; });
load(EPISODES[0]);
</script>
